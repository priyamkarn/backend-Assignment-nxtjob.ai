name: job-board-api
services:
  - name: backend
    instance_types:
      - name: nano
    ports:
      - port: 4500
        http: true
    routes:
      - path: /
        port: 4500
    env:
      - name: PORT
        value: "4500"
    healthCheck:
      httpGet:
        path: /health
        port: 4500
      initialDelaySeconds: 10
      periodSeconds: 30